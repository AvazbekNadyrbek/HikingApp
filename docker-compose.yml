version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: berchtesgaden-postgres
    environment:
      POSTGRES_DB: berchtesgaden_explorer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: