spring:
  application:
    name: explorer
  profiles:
    active: dev
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true  # для существующих БД
    baseline-version: 1
    validate-on-migrate: true


jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

logging:
  level:
    org:
      springframework: ERROR